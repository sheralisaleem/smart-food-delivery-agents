<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Smart Food Delivery Agents</title>
<style>
/* Layout: header + tabs; the Lab is a sticky result strip over a two-column workspace (controls | results);
   colour is reserved for data: routes (A blue, B orange, C aqua), utility factors, and good/bad status. Chrome stays ink-and-paper. */
:root {
  --page: #f6f6f3; --surface: #fcfcfb; --soft: #f0efec; --soft2: #e6e5df;
  --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --hair: rgba(11, 11, 11, .10); --grid: #e1e0d9; --axis: #c3c2b7;
  --r-a: #2a78d6; --r-b: #eb6834; --r-c: #1baf7a; --on-route: #0b0b0b;
  --f-time: #eda100; --f-dist: #e87ba4; --f-traffic: #008300; --f-cost: #6250d6; --f-late: #e34948;
  --good: #0ca30c; --bad: #d03b3b;
  --bar: #8f8e86; --bar-soft: #cfcec6;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0d0d0d; --surface: #1a1a19; --soft: #242422; --soft2: #2f2f2c;
    --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --hair: rgba(255, 255, 255, .10); --grid: #2c2c2a; --axis: #383835;
    --r-a: #3987e5; --r-b: #d95926; --r-c: #199e70; --on-route: #0d0d0d;
    --f-time: #c98500; --f-dist: #d55181; --f-traffic: #008300; --f-cost: #9085e9; --f-late: #e66767;
    --bar: #7d7c73; --bar-soft: #3b3b38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0d0d0d; --surface: #1a1a19; --soft: #242422; --soft2: #2f2f2c;
  --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --hair: rgba(255, 255, 255, .10); --grid: #2c2c2a; --axis: #383835;
  --r-a: #3987e5; --r-b: #d95926; --r-c: #199e70; --on-route: #0d0d0d;
  --f-time: #c98500; --f-dist: #d55181; --f-traffic: #008300; --f-cost: #9085e9; --f-late: #e66767;
  --bar: #7d7c73; --bar-soft: #3b3b38;
  color-scheme: dark;
}
body { background: var(--page); color: var(--ink); font: 15px/1.45 var(--sans); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
.shell { max-width: 1240px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 0 40px; }
.only-narrow { display: inline-flex; }
@media (min-width: 1024px) { .only-narrow { display: none; } }

/* ---------- header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 18px 14px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: 20px; font-weight: 650; letter-spacing: -.01em; line-height: 1.2; text-wrap: balance; }
.brand p { font-size: 13px; color: var(--ink2); margin-top: 2px; text-wrap: balance; }
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--soft); border-radius: 12px; max-width: 100%; }
.tabs button { border: 0; background: transparent; color: var(--ink2); font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 9px; min-height: 36px; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--hair), 0 1px 2px rgba(0, 0, 0, .08); }
@media (max-width: 520px) { .tabs { width: 100%; } .tabs button { flex: 1; padding-inline: 6px; } }

/* ---------- shared pieces ---------- */
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 16px; min-width: 0; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin: 26px 0 10px; }
.sec-h h2 { font-size: 17px; font-weight: 650; letter-spacing: -.005em; }
.sec-h p { font-size: 13px; color: var(--ink2); max-width: 62ch; text-wrap: pretty; }
.eyebrow, .fld > label, .fld-h > label:first-child, .lab { font-size: 11.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
.ic { width: 1em; height: 1em; flex: none; vertical-align: -.125em; }
.rt { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 12px; font-weight: 700; color: var(--on-route); flex: none; line-height: 1; }
.ra { background: var(--r-a); } .rb { background: var(--r-b); } .rc { background: var(--r-c); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; line-height: 1.3; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--ink2); white-space: nowrap; }
.pill.warn { color: var(--ink); }
.st { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 13px; padding: 2px 9px 2px 7px; border-radius: 999px; white-space: nowrap; }
.st.ok { background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.st.late { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.st.ok .ic { color: var(--good); } .st.late .ic { color: var(--bad); }
.tp { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
.tp i { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.tp i b { width: 4px; border-radius: 1px; background: var(--axis); }
.tp i b:nth-child(1) { height: 5px; } .tp i b:nth-child(2) { height: 8px; } .tp i b:nth-child(3) { height: 12px; }
.tp.l1 i b:nth-child(-n+1), .tp.l2 i b:nth-child(-n+2), .tp.l3 i b:nth-child(-n+3) { background: var(--ink); }
.tp.none { color: var(--ink2); }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- controls ---------- */
.seg { display: flex; gap: 2px; padding: 3px; background: var(--soft); border-radius: 10px; width: 100%; }
.seg button { flex: 1 1 0; min-width: 0; border: 0; background: transparent; color: var(--ink2); font-size: 13px; padding: 6px 4px; border-radius: 8px; min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--hair); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-checked="true"], .chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 600; }
.fld { display: grid; gap: 6px; margin-bottom: 10px; min-width: 0; }
.fld > label { display: flex; justify-content: space-between; gap: 8px; }
.fld-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fld-h > label:first-child { display: flex; gap: 8px; }
.two-fld { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0 10px; }
.fld output { font-weight: 650; letter-spacing: 0; text-transform: none; color: var(--ink); font-size: 13px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; accent-color: var(--ink); }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--axis); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--axis); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px; border-radius: 50%; background: var(--ink); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--ink); }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--ink); }
select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 6px 8px; min-height: 34px; max-width: 100%; }
.checkrow { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); }
.checkrow input { width: 18px; height: 18px; accent-color: var(--ink); margin: 0; }
.scen-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.scen-h h2 { font-size: 17px; font-weight: 650; }
.btn { border: 1px solid var(--axis); background: var(--surface); border-radius: 9px; padding: 6px 12px; font-size: 13px; font-weight: 600; min-height: 34px; align-items: center; gap: 6px; }
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.presets button { text-align: left; border: 1px solid var(--hair); background: var(--surface); border-radius: 10px; padding: 6px 10px; display: grid; gap: 1px; min-height: 46px; align-content: center; }
.presets button b { font-size: 13px; } .presets button small { font-size: 11.5px; color: var(--ink2); }
.presets button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.presets button[aria-pressed="true"] small { color: inherit; opacity: .8; }
.road { border-top: 1px solid var(--hair); padding-block: 10px 2px; display: grid; gap: 6px; }
.road-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; }
.road-n { display: inline-flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; white-space: nowrap; }
.road-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.alert-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); flex: 1 1 170px; min-width: 0; }
.alert-row select { flex: 1; min-width: 0; }
.scen-body[hidden] { display: none; }

/* ---------- lab layout ---------- */
.live { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--page); margin-inline: calc(var(--gutter) * -1); padding: 8px var(--gutter) 10px; border-bottom: 1px solid var(--hair); }
.live-h { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink2); margin-bottom: 5px; }
.tiles { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.tile { position: relative; display: grid; justify-items: center; align-content: start; gap: 3px; padding: 5px 0 6px; border-radius: 10px; border: 1px solid var(--hair); background: var(--surface); min-width: 0; }
.tile .n { font-size: 11px; font-weight: 650; color: var(--ink2); line-height: 1.2; }
.tile .nm, .tile .mn { display: none; font-size: 11px; color: var(--ink2); line-height: 1.2; text-align: center; padding-inline: 2px; }
.tile .ic { width: 15px; height: 15px; }
.tile .ic.ok { color: var(--good); } .tile .ic.late { color: var(--bad); }
.tile.best { background: var(--soft); }
.tile.changed { animation: flash .9s ease-out 1; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--ink); } 100% { box-shadow: 0 0 0 3px transparent; } }
@media (prefers-reduced-motion: reduce) { .tile.changed { animation: none; } }
@media (min-width: 720px) { .tiles { gap: 8px; } .tile .nm, .tile .mn { display: block; } .tile { padding-block: 8px; } }
.lab-grid { display: grid; gap: 16px; margin-top: 14px; align-items: start; }
@media (min-width: 1024px) {
  .lab-grid { grid-template-columns: 340px minmax(0, 1fr); gap: 20px; }
  .scen { position: sticky; top: 88px; max-height: calc(100vh - 104px); overflow-y: auto; }
}
.results { display: grid; gap: 16px; min-width: 0; }
.hero { display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; align-items: center; }
.hero .big { display: flex; align-items: baseline; gap: 2px; line-height: 1; }
.hero .big b { font-size: 56px; font-weight: 650; letter-spacing: -.03em; }
.hero .big span { font-size: 24px; color: var(--ink2); font-weight: 500; }
.hero-t { display: grid; gap: 4px; min-width: 0; }
.hero-t strong { font-size: 16px; }
.hero-t span { font-size: 13px; color: var(--ink2); text-wrap: pretty; }
.votes { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; padding-top: 10px; border-top: 1px solid var(--hair); align-items: center; }
.votes > span { display: inline-flex; align-items: center; gap: 6px; }
.rgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.rcard { display: grid; gap: 10px; align-content: start; padding: 14px; }
.rcard-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rcard-h strong { font-size: 15px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.truth-t { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.truth-t b { font-size: 24px; font-weight: 650; letter-spacing: -.01em; }
.truth-t small { font-size: 12px; color: var(--ink2); }
.eff { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 12.5px; color: var(--ink2); }
.eff li { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.eff li b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.chosen-by { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); }
.chosen-by b { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 6px; background: var(--ink); color: var(--surface); font-size: 11px; }
.agents { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); align-items: start; }
.acard { display: flex; flex-direction: column; gap: 12px; }
.acard-h { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; }
.acard-n { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.acard-h h3 { font-size: 15px; font-weight: 650; line-height: 1.25; }
.acard-h p { font-size: 12.5px; color: var(--ink2); margin-top: 2px; text-wrap: pretty; }
.result { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13.5px; }
.result .sep { color: var(--axis); }
.viz { min-width: 0; display: grid; gap: 8px; }
.viz svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.why { font: 11.5px/1.5 var(--mono); color: var(--ink2); background: var(--soft); border-radius: 8px; padding: 8px 10px; overflow-wrap: anywhere; }
.arch summary, .nums summary { cursor: pointer; font-size: 13px; color: var(--ink2); padding: 4px 0; }
.arch img { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--hair); background: #fff; display: block; margin-top: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink2); }
.legend > span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.hollow { background: transparent; border: 2px solid var(--ink2); border-radius: 50%; width: 11px; height: 11px; }
.legend i.dotc { border-radius: 50%; background: var(--ink2); width: 11px; height: 11px; }
.legend i.tick { width: 2px; height: 12px; border-radius: 0; background: var(--ink); }
.legend i.dl { width: 2px; height: 12px; border-radius: 0; background: var(--ink2); opacity: .55; }
.minitbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.minitbl th { text-align: left; font-weight: 650; color: var(--ink2); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding: 4px 6px 4px 0; }
.minitbl td { padding: 6px 6px 6px 0; border-top: 1px solid var(--hair); vertical-align: middle; }
.minitbl td:last-child, .minitbl th:last-child { padding-right: 0; }
.scroll-x { overflow-x: auto; max-width: 100%; }
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rule { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; padding: 8px; border: 1px solid var(--hair); border-radius: 10px; font-size: 12.5px; }
.rule .rid { font-weight: 700; font-size: 12px; align-self: start; padding-top: 1px; }
.rule .rtxt { color: var(--ink); }
.rule .rchk { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; color: var(--ink2); font-size: 12px; }
.rule .rchk span { display: inline-flex; align-items: center; gap: 4px; }
.rule .rchk .ic.y { color: var(--good); } .rule .rchk .ic.n { color: var(--bad); }
.rule.fired { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.rule.fired .rtxt, .rule.fired .rchk { color: var(--surface); }
.rule.fired .rchk .ic.y, .rule.fired .rchk .ic.n { color: var(--surface); }
.rule.skipped { opacity: .55; }
.rule .tag { float: right; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-left: 8px; }
.rulechips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink2); }
.rulechips b { min-width: 30px; text-align: center; border: 1px solid var(--axis); border-radius: 8px; padding: 3px 8px; color: var(--ink2); }
.rulechips b.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.steps li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; position: relative; padding-bottom: 8px; font-size: 13px; }
.steps li::before { content: ""; position: absolute; left: 11px; top: 24px; bottom: 0; width: 2px; background: var(--grid); }
.steps li:last-child::before { display: none; }
.steps b { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--ink); color: var(--surface); }
.steps li small { display: block; color: var(--ink2); font-size: 12px; }
.ctx { display: flex; flex-wrap: wrap; gap: 6px; }
.ctx .pill { color: var(--ink); background: var(--soft); }

/* ---------- scoreboard & learning ---------- */
.ctrl-row { display: grid; gap: 12px; margin-bottom: 14px; }
.ctrl-row .seg { max-width: 440px; }
.take { font-size: 14px; color: var(--ink); margin-bottom: 12px; text-wrap: pretty; }
.take b { font-weight: 650; }
.dots { display: grid; grid-template-columns: minmax(96px, 164px) minmax(0, 1fr) 52px; column-gap: 10px; align-items: center; }
.dots .lab2 { font-size: 13px; padding: 6px 0; line-height: 1.25; }
.dots .lab2.best { font-weight: 650; }
.dots .lab2 small { color: var(--ink2); display: block; font-size: 11.5px; font-weight: 400; }
.dots .val { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 13px; }
.dots .track { position: relative; height: 32px; background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px); background-size: calc(100% / var(--n)) 100%; border-right: 1px solid var(--grid); outline-offset: -2px; }
.dots .track::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--grid); }
.dots .dot { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--ink2); box-shadow: 0 0 0 2px var(--surface); z-index: 1; }
.dots .dot.best { background: var(--ink); width: 16px; height: 16px; margin: -8px 0 0 -8px; }
.dots .dot.ref { background: var(--surface); border: 2px solid var(--ink2); box-sizing: border-box; }
.dots .axis { position: relative; height: 18px; font-size: 11.5px; color: var(--ink2); }
.dots .axis span { position: absolute; top: 0; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.dots .axis span:first-child { transform: none; } .dots .axis span:last-child { transform: translateX(-100%); }
.dots .sep { grid-column: 1 / -1; border-top: 1px solid var(--hair); margin: 4px 0; }
.dots .row-hit { display: contents; }
.mix { display: grid; grid-template-columns: minmax(96px, 164px) minmax(0, 1fr); column-gap: 10px; row-gap: 4px; align-items: center; }
.mixbar { display: flex; gap: 2px; height: 24px; border-radius: 6px; overflow: hidden; }
.mixbar span { display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: var(--on-route); min-width: 0; overflow: hidden; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 8px 6px; border-bottom: 1px solid var(--hair); text-align: center; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; white-space: normal; }
.tbl thead th { font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink2); font-weight: 650; }
.tbl .cell, .minitbl .cell { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

/* engine.js - line-for-line JavaScript port of the Python package food_delivery_agents
   (environment.py, base.py, agent1 ... agent7). test_engine.js checks that every decision, reason string,
   plan and outcome is identical to what the Python agents produce. `trace` objects are extra data for the charts. */
(function (root) {
  'use strict';

  // ---------------------------------------------------------------- constants
  const SPEED_KMH = { light: 40, normal: 30, heavy: 12 };
  const RAIN_FACTOR = 0.8, OVERHEAD_MIN = 7, FUEL_RS_PER_KM = 8;
  const TRAFFIC_SCORE = { light: 0.0, normal: 0.5, heavy: 1.0 };
  const TRAFFIC_RANK = { light: 0, normal: 1, heavy: 2 };
  const ALERT_DELAY_MIN = { accident: 12, road_works: 8, procession: 15 };
  const EXPECTED_ALERT_DELAY = { accident: 10, road_works: 6, procession: 12 };
  const DEFAULT_WEIGHTS = { time: 0.50, distance: 0.15, traffic: 0.15, cost: 0.20 };
  const LATE_PENALTY = 3.0;
  const ROAD_NETWORK = [['A', 3.5, 0, false], ['B', 5.5, 0, true], ['C', 4.5, 60, false]];

  // ---------------------------------------------------------------- Python-compatible helpers
  // f"{x:.Nf}": Python rounds an exact tie half-to-even, JavaScript's toFixed rounds it up.
  function pyfmt(x, d) {
    const neg = x < 0 || Object.is(x, -0), a = Math.abs(x), s2 = a * Math.pow(2, d + 1);
    let body;
    if (Number.isInteger(s2) && s2 % 2 === 1) {
      const k = Math.floor(a * Math.pow(10, d)), n = k % 2 === 0 ? k : k + 1;
      const t = String(n).padStart(d + 1, '0');
      body = d ? t.slice(0, -d) + '.' + t.slice(-d) : t;
    } else body = a.toFixed(d);
    return (neg ? '-' : '') + body;
  }
  function cmp(a, b) {                                   // Python ordering of numbers, strings and tuples
    if (Array.isArray(a)) { for (let i = 0; i < a.length; i++) { const c = cmp(a[i], b[i]); if (c) return c; } return 0; }
    return a < b ? -1 : a > b ? 1 : 0;
  }
  function minBy(arr, key) { let best, bk, first = true; for (const x of arr) { const k = key(x); if (first || cmp(k, bk) < 0) { best = x; bk = k; first = false; } } return best; }
  function maxBy(arr, key) { let best, bk, first = true; for (const x of arr) { const k = key(x); if (first || cmp(k, bk) > 0) { best = x; bk = k; first = false; } } return best; }
  const pyDict = o => '{' + Object.keys(o).map(k => `'${k}': '${o[k]}'`).join(', ') + '}';

  // ---------------------------------------------------------------- environment.py
  function travelMinutes(km, traffic, weather) {
    const speed = SPEED_KMH[traffic] * (weather === 'rain' ? RAIN_FACTOR : 1.0);
    return km / speed * 60;
  }
  const nominalEta = (km, traffic, weather) => OVERHEAD_MIN + travelMinutes(km, traffic, weather);
  const routeCost = (km, toll) => km * FUEL_RS_PER_KM + toll;

  function percept(s, stage) {                           // what an agent may sense (the feed can be down at pickup)
    const down = stage === 'pickup' ? s.feedDown : [];
    return { stage, orderId: s.order, urgent: s.urgent, deadline: s.deadline, weather: s.weather, context: s.ctx,
             routes: s.routes.map(r => ({ name: r.name, km: r.km, traffic: down.includes(r.name) ? null : r.traffic,

  }
  function hiddenFactor(r, weather) {

    if (r.name === 'A' && r.traffic === 'heavy') f *= 1.30;
    if (r.underpass && weather === 'rain') f *= 1.40;
    if (r.toll) f *= 0.95;
    return f;
  }
  function execute(s, routeName) {                       // ground truth (no noise, as in the 3 tests and the benchmark)
    const r = s.routes.find(x => x.name === routeName);

    if (s.ctx.time === 'rush_hour' && r.traffic !== 'light') t *= 1.10;

  function explain(s, routeName) {                       // why reality differs from the published estimate (for display)

    if (r.name === 'A' && r.traffic === 'heavy') effects.push({ kind: 'spill', factor: 1.30, text: 'market spill-over: the jam is worse than reported' });
    if (r.underpass && s.weather === 'rain') effects.push({ kind: 'flood', factor: 1.40, text: 'underpass waterlogs in rain' });
    if (r.toll) effects.push({ kind: 'toll', factor: 0.95, text: 'toll road runs a little faster than reported' });

const hideTip = () => { tipEl.hidden = true; };
function tipFromEvent(e) {
  if (e.target && e.target.closest && e.target.closest('[data-own-tip]')) return;
  const t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
  if (t) showTip(t.getAttribute('data-tip'), e.clientX, e.clientY); else hideTip();
}
document.addEventListener('pointermove', tipFromEvent);
document.addEventListener('pointerdown', tipFromEvent);
document.addEventListener('pointerleave', hideTip);
document.addEventListener('scroll', hideTip, true);
document.addEventListener('focusin', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (t) { const r = t.getBoundingClientRect(); showTip(t.getAttribute('data-tip'), r.left + Math.min(r.width, 160) / 2, r.bottom - 8); }
});
document.addEventListener('focusout', hideTip);

// ---------------------------------------------------------------- small builders
function seg(id, label, options) {
  return `<div class="seg" id="${id}" role="radiogroup" aria-label="${esc(label)}">` +
    options.map(o => `<button type="button" role="radio" aria-checked="false" data-v="${o[0]}">${o[2] ? ic(o[2]) : ''}<span>${esc(o[1])}</span></button>`).join('') + '</div>';
}
function setSeg(id, value) {
  $$('#' + id + ' button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.v === String(value))));
}
const niceStep = (range, target = 5) => {
  const raw = range / target, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
};

/* ui_viz.js - one small visual per agent (how it decides) plus the road "reality" bar. Every function returns an HTML string. */
'use strict';
const RV = n => `var(--r-${n.toLowerCase()})`;
const svgBox = (W, H, label, inner) => `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(label)}">${inner}</svg>`;
const txt = (x, y, s, cls = '', anchor = 'start') => `<text x="${x}" y="${y}" text-anchor="${anchor}"${cls ? ` class="${cls}"` : ''}>${esc(s)}</text>`;
const chipSvg = (cx, cy, n) => `<circle cx="${cx}" cy="${cy}" r="10" style="fill:${RV(n)}"/><text x="${cx}" y="${cy + 4}" text-anchor="middle" style="fill:var(--on-route);font-weight:700;font-size:11.5px">${n}</text>`;
const barPath = (x, y, w, h, r = 4) => { r = Math.max(0, Math.min(r, w, h / 2)); return `M${x} ${y}h${w - r}a${r} ${r} 0 0 1 ${r} ${r}v${h - 2 * r}a${r} ${r} 0 0 1 ${-r} ${r}h${-(w - r)}z`; };
const markIcon = (ok, x, y) => `<g transform="translate(${x},${y}) scale(.667)" fill="none" stroke="${ok ? 'var(--good)' : 'var(--bad)'}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">${ok ? ICON.check : ICON.cross}</g>`;
const minus = s => String(s).replace('-', '−');
function ticks(sx, max, yTop, yBottom, labelY) {
  const step = niceStep(max, 5);
  let g = '';
  for (let v = 0; v <= max + 1e-9; v += step) g += `<line class="grid" x1="${sx(v)}" x2="${sx(v)}" y1="${yTop}" y2="${yBottom}"/>` + txt(sx(v), labelY, String(Math.round(v * 100) / 100), '', 'middle');
  return g;
}
function deadlineMark(sx, deadline, yTop, yBottom, labelY, W, label = 'deadline') {
  const x = sx(deadline), anchor = x > W - 52 ? 'end' : 'middle';
  return `<line class="dl" x1="${x}" x2="${x}" y1="${yTop}" y2="${yBottom}"/>` + txt(x, labelY, `${label} ${deadline}`, '', anchor);
}

// ---------------------------------------------------------------- reality bar for one road
function vizTruth(t, W, deadline, maxMin) {
  const sx = v => v / maxMin * W, H = 40, y = 20, h = 12;
  const total = t.total, split = Math.min(total, Math.max(deadline, 7));
  let g = deadlineMark(sx, deadline, 12, 38, 9, W);
  g += `<path d="${barPath(0, y, sx(7), h, 0)}" style="fill:var(--bar-soft)" stroke="var(--surface)" stroke-width="2"/>`;
  g += `<path d="${barPath(sx(7), y, Math.max(2, sx(split) - sx(7)), h, total > deadline ? 0 : 4)}" style="fill:var(--bar)" stroke="var(--surface)" stroke-width="2"/>`;
  if (total > deadline) g += `<path d="${barPath(sx(deadline), y, Math.max(2, sx(total) - sx(deadline)), h, 4)}" style="fill:var(--bad)" stroke="var(--surface)" stroke-width="2"/>`;
  return svgBox(W, H, `Real delivery time ${f1(total)} minutes against a ${deadline} minute deadline`, g);
}

// ---------------------------------------------------------------- agent 1: IF-THEN rules
const RULE_TXT = { R1: 'IF the shortest road is heavy, take the lightest other road',
                   R2: 'IF it rains AND the shortest road is normal AND a light road exists, take the light road',
                   R3: 'OTHERWISE take the shortest road' };
function vizRules(t) {
  return '<ol class="rules">' + t.rules.map(r => {
    const cls = r.fired ? 'fired' : r.reached ? '' : 'skipped';
    const tag = r.fired ? `fires: road ${t.chosen}` : r.reached ? 'no match' : 'not checked';
    const chk = r.reached && r.id !== 'R3' ? r.checks.map(c => `<span>${ic(c.ok ? 'check' : 'cross', c.ok ? 'y' : 'n')}${esc(c.label)}${!c.ok && c.val ? ` (${esc(c.val)})` : ''}</span>`).join('') : '';
    return `<li class="rule ${cls}"><span class="rid">${r.id}</span><div><div class="rtxt"><span class="tag">${tag}</span>${esc(RULE_TXT[r.id])}</div>${chk ? `<div class="rchk">${chk}</div>` : ''}</div></li>`;
  }).join('') + '</ol>';
}

// ---------------------------------------------------------------- agent 2: internal state
const RULE_STATE = { R0: 'keep the current road', R1: 'shortest is heavy: lightest other road', R2: 'rain and normal traffic: light road', R3: 'otherwise: shortest road' };
function vizState(t) {
  const rows = t.routes.map(r => `<tr><td>${chip(r.name)}</td><td>${r.live ? tp(r.live) : `<span class="tp none">${ic('nosig')}no signal</span>`}</td>` +
    `<td>${r.memory ? tp(r.memory) : '<span class="tp none">none yet</span>'}</td><td>${tp(r.used)}${r.live === null ? ' <span class="pill">remembered</span>' : ''}</td></tr>`).join('');
  return `<div class="scroll-x"><table class="minitbl"><thead><tr><th>Road</th><th>Live feed</th><th>Memory</th><th>Rules read</th></tr></thead><tbody>${rows}</tbody></table></div>` +
    `<div class="rulechips"><span>Rule fired</span>${['R0', 'R1', 'R2', 'R3'].map(id => `<b class="${id === t.rule ? 'on' : ''}">${id}</b>`).join('')}<span>${RULE_STATE[t.rule]}</span></div>` +
    `<div class="legend"><span>Internal state: order status <b>${esc(t.status)}</b></span><span>weather <b>${esc(t.weather)}</b></span></div>`;
}

// ---------------------------------------------------------------- agent 3: goal test
function vizGoal(t, ctx) {
  const W = ctx.W, rowH = 32, top = 24, x0 = 34, x1 = W - 96, n = t.rows.length, H = top + n * rowH + 22;
  const max = Math.max(t.deadline * 1.2, ...t.rows.filter(r => r.checked).map(r => r.eta)) * 1.04, sx = v => x0 + v / max * (x1 - x0);
  let g = ticks(sx, max, top - 4, top + n * rowH, H - 6) + deadlineMark(sx, t.deadline, top - 8, top + n * rowH, 11, W);
  t.rows.forEach((r, i) => {
    const y = top + i * rowH, cy = y + rowH / 2, tipText = `Road ${r.name}\n${r.checked ? `Predicted ${f1(r.eta)} min vs deadline ${t.deadline}: ${r.pass ? 'goal met' : 'goal missed'}` : `Not checked: an earlier road already met the goal (it would be ${f1(r.eta)} min)`}`;
    g += `<g data-tip="${esc(tipText)}" tabindex="0">`;
    if (r.name === t.chosen) g += `<rect x="0" y="${y}" width="${W}" height="${rowH}" rx="8" style="fill:var(--soft)"/>`;
    g += chipSvg(16, cy, r.name);
    if (r.checked) {
      g += `<path d="${barPath(x0, cy - 7, Math.max(3, sx(r.eta) - x0), 14, 4)}" style="fill:var(--bar)"/>` + txt(x1 + 8, cy + 4, `${f1(r.eta)} min`, 't-ink') + markIcon(r.pass, W - 24, cy - 8);
    } else g += `<g opacity=".6">${txt(x0 + 4, cy + 4, 'not checked')}</g>`;
    g += '</g>';
  });
  const label = 'Goal test in order of distance: ' + t.rows.map(r => r.checked ? `road ${r.name} ${f1(r.eta)} minutes ${r.pass ? 'meets' : 'misses'} the goal` : `road ${r.name} not checked`).join('; ');
  return svgBox(W, H, label, g) + `<div class="legend"><span>Roads are tried shortest first; the first one that meets the deadline wins.${t.atRisk ? ' None did, so the fastest prediction was taken (goal at risk).' : ''}</span></div>`;
}

// ---------------------------------------------------------------- agent 4: utility = what each road costs, split by factor
const PARTS = [['time', 'Time', 'var(--f-time)'], ['distance', 'Distance', 'var(--f-dist)'], ['traffic', 'Traffic', 'var(--f-traffic)'], ['cost', 'Cost', 'var(--f-cost)'], ['late', 'Late penalty', 'var(--f-late)']];
function vizUtility(t, ctx) {
  const W = ctx.W, blockH = 46, top = 2, x0 = 34, x1 = W - 2, n = t.routes.length, H = top + n * blockH;
  const core = r => r.parts.time + r.parts.distance + r.parts.traffic + r.parts.cost;
  const maxCore = Math.max(...t.routes.map(core)) * 1.15, sx = v => v / maxCore * (x1 - x0);
  let g = '';
  t.routes.forEach((r, i) => {
    const y = top + i * blockH, by = y + 22, chosen = r.name === t.chosen, km = ctx.sc.routes.find(q => q.name === r.name).km;
    const tips = { time: `weight x ETA / deadline = ${f2(r.parts.time)}`, distance: `weight x ${km} km / 10 = ${f2(r.parts.distance)}`, traffic: `weight x traffic score = ${f2(r.parts.traffic)}`,
                   cost: `weight x Rs ${f0(r.cost)} / 100 = ${f2(r.parts.cost)}`, late: `3.0 x (1 + minutes late / deadline) = ${f2(r.parts.late)}` };
    g += chipSvg(14, by + 7, r.name) + txt(x0, y + 12, `${f0(r.eta)} min · Rs ${f0(r.cost)} · ${r.traffic}`) + txt(x1, y + 12, `U ${minus(f2(r.u))}${chosen ? '  ✓ best' : ''}`, chosen ? 't-ink' : '', 'end');
    let x = x0, clipped = false;
    for (const [key, name, color] of PARTS) {
      const v = r.parts[key];
      if (v <= 0 || clipped) continue;
      let w = sx(v);
      if (x + w >= x1) { w = x1 - x; clipped = true; }
      g += `<rect x="${x}" y="${by}" width="${Math.max(1, w)}" height="14" style="fill:${color}" stroke="var(--surface)" stroke-width="2" data-tip="${esc(`Road ${r.name}: ${name} ${f2(v)}\n${tips[key]}`)}" tabindex="0"/>`;
      x += w;
    }
    if (clipped) g += `<path d="M${x1 - 10} ${by - 1}l-4 16M${x1 - 5} ${by - 1}l-4 16" stroke="var(--surface)" stroke-width="2" fill="none"/>`;
  });
  const legend = '<div class="legend">' + PARTS.map(p => `<span><i style="background:${p[2]}"></i>${p[1]}</span>`).join('') + '</div>';
  const rows = t.routes.map(r => `<tr><td>${chip(r.name)}</td>${PARTS.map(p => `<td class="num">${f2(r.parts[p[0]])}</td>`).join('')}<td class="num"><b>${minus(f2(r.u))}</b></td></tr>`).join('');
  const table = `<details class="nums"><summary>Show the numbers</summary><div class="scroll-x"><table class="minitbl"><thead><tr><th>Road</th>${PARTS.map(p => `<th>${p[1].replace('Late penalty', 'Late')}</th>`).join('')}<th>Utility</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
  return svgBox(W, H, 'Cost of each road split into time, distance, traffic, cost and late penalty; shorter is better. ' + t.routes.map(r => `Road ${r.name} utility ${f2(r.u)}`).join(', '), g) +
    legend + `<div class="legend"><span>Bar = what the road costs the agent. Shorter wins; a broken bar means the late penalty runs off the scale.</span></div>` + table;
}

// ---------------------------------------------------------------- agents 5 and 7: published estimate -> the agent's own estimate, against reality
function vizBelief(t, ctx, mode) {
  const W = ctx.W, rowH = 36, top = 26, x0 = 34, x1 = W - 66, n = t.rows.length, H = top + n * rowH + 22;
  const truth = r => ctx.truth[r.name].total;
  const max = Math.max(t.deadline * 1.1, ...t.rows.flatMap(r => [r.eta, r.published, truth(r)])) * 1.06, sx = v => x0 + v / max * (x1 - x0);
  let g = ticks(sx, max, top - 6, top + n * rowH, H - 6) + deadlineMark(sx, t.deadline, top - 10, top + n * rowH, 11, W);
  t.rows.forEach((r, i) => {
    const y = top + i * rowH, cy = y + rowH / 2, chosen = r.name === t.chosen, real = truth(r);
    const right = mode === 'learning' ? `×${f2(r.factor)}` : (Math.abs(r.eta - r.published) < 0.05 ? 'no change' : `${r.eta > r.published ? '+' : ''}${f1(r.eta - r.published)} min`);
    const tipText = `Road ${r.name}\nPublished estimate ${f1(r.published)} min\n${mode === 'learning' ? `Learned estimate ${f1(r.eta)} min (factor ${f2(r.factor)}, ${r.samples} past deliveries)` : `Context-adjusted ${f1(r.eta)} min`}\nReality ${f1(real)} min`;
    g += `<g data-tip="${esc(tipText)}" tabindex="0">`;
    if (chosen) g += `<rect x="0" y="${y}" width="${W}" height="${rowH}" rx="8" style="fill:var(--soft)"/>`;
    g += chipSvg(16, cy, r.name) + `<line class="grid" x1="${x0}" x2="${x1}" y1="${cy}" y2="${cy}"/>`;
    if (Math.abs(r.eta - r.published) > 0.05) g += `<line x1="${sx(r.published)}" x2="${sx(r.eta)}" y1="${cy}" y2="${cy}" style="stroke:${RV(r.name)}" stroke-width="3" stroke-linecap="round"/>`;
    g += `<circle cx="${sx(r.published)}" cy="${cy}" r="5" style="fill:var(--surface);stroke:var(--ink2)" stroke-width="2"/>`;
    g += `<circle cx="${sx(r.eta)}" cy="${cy}" r="5.5" style="fill:${RV(r.name)};stroke:var(--surface)" stroke-width="2"/>`;
    g += `<line x1="${sx(real)}" x2="${sx(real)}" y1="${cy - 10}" y2="${cy + 10}" style="stroke:var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`;
    g += txt(x1 + 10, cy + 4, right, chosen ? 't-ink' : '') + '</g>';
  });
  const legend = '<div class="legend"><span><i class="hollow"></i>published estimate</span><span><i class="dotc"></i>' + (mode === 'learning' ? 'learned estimate' : 'adjusted estimate') + '</span><span><i class="tick"></i>reality</span><span><i class="dl"></i>deadline</span></div>';
  return svgBox(W, H, 'Published, estimated and real minutes per road: ' + t.rows.map(r => `road ${r.name} published ${f1(r.published)}, estimate ${f1(r.eta)}, real ${f1(truth(r))}`).join('; '), g) + legend;
}
function vizLearning(t, ctx) {
  const exp = DATA.learn.steps[S.exp];
  const lead = `<div class="legend"><span>Experience: <b>${exp}</b> past deliveries${exp === 0 ? ' (nothing learned yet: it behaves like the utility agent)' : ''}</span></div>`;
  return lead + vizBelief(t, ctx, 'learning');
}

// ---------------------------------------------------------------- agent 6: subgoals under a time budget
function vizHier(t, ctx) {
  const W = ctx.W, rsv = t.reserved, ride = t.eta - 7;
  const steps = [['Accept order', `${ctx.sc.order} · ${t.deadline} min${ctx.sc.urgent ? ' · urgent' : ''}`], ['Choose route', `road ${t.chosen}: ${t.how}`],
                 ['Pick up food', `budget ${rsv['Pick up food']} min`], ['Deliver order', `via ${t.chosen}, predicted total ${f1(t.eta)} min`], ['Confirm delivery', `budget ${rsv['Confirm delivery']} min`]];
  const list = '<ol class="steps">' + steps.map((s, i) => `<li><b>${i + 1}</b><div>${s[0]}<small>${esc(s[1])}</small></div></li>`).join('') + '</ol>';
  const max = Math.max(t.deadline * 1.3, t.eta * 1.05), x0 = 2, x1 = W - 2, sx = v => x0 + v / max * (x1 - x0), y = 24, h = 14, H = 56;
  let g = `<line class="dl" x1="${sx(t.deadline)}" x2="${sx(t.deadline)}" y1="12" y2="${y + h + 4}"/>` + txt(sx(t.deadline) + 4, 10, `deadline ${t.deadline}`);
  g += `<line class="dl" x1="${sx(t.budget)}" x2="${sx(t.budget)}" y1="12" y2="${y + h + 4}"/>` + txt(sx(t.budget) - 4, 10, `budget ${f0(t.budget)}`, '', 'end');
  const seg = [[0, rsv['Pick up food'], 'var(--bar-soft)', 'pick-up'], [rsv['Pick up food'], rsv['Pick up food'] + ride, 'var(--bar)', 'ride'], [rsv['Pick up food'] + ride, t.eta, 'var(--bar-soft)', 'confirm']];
  seg.forEach((s, i) => { g += `<rect x="${sx(s[0])}" y="${y}" width="${Math.max(1, sx(s[1]) - sx(s[0]))}" height="${h}" style="fill:${s[2]}" stroke="var(--surface)" stroke-width="2" data-tip="${esc(`${s[3]}: ${f1(s[1] - s[0])} min`)}" tabindex="0"/>`; });
  g += txt(sx(t.eta), y + h + 14, `predicted ${f1(t.eta)} min`, 't-ink', sx(t.eta) > W - 80 ? 'end' : 'start');
  const fit = '<div class="scroll-x"><table class="minitbl"><thead><tr><th>Road</th><th>Predicted</th><th>Utility</th><th>Within budget</th></tr></thead><tbody>' + t.options.map(o =>
    `<tr><td>${chip(o.name)}</td><td class="num">${f1(o.eta)} min</td><td class="num">${minus(f2(o.u))}</td><td><span class="cell">${o.fits ? `<span class="st ok">${ic('check')}fits</span>` : `<span class="st late">${ic('cross')}over</span>`}${o.name === t.chosen ? '<b class="tag-chosen">chosen</b>' : ''}</span></td></tr>`).join('') + '</tbody></table></div>';
  return list + svgBox(W, H, `Plan: pick-up 5 minutes, ride ${f1(ride)} minutes, confirm 2 minutes; budget ${f0(t.budget)} and deadline ${t.deadline}`, g) +
    `<div class="legend"><span><i style="background:var(--bar-soft)"></i>pick-up and hand-over</span><span><i style="background:var(--bar)"></i>ride</span></div>` + fit;
}

// ---------------------------------------------------------------- agent 7: context, adapted weights, adjusted estimates
function vizContext(t, ctx) {
  const c = ctx.sc.ctx, W = ctx.W, chips = [];
  if (c.food === 'hot') chips.push(`${ic('flame')}hot food: time weighs ×1.5`);
  if (c.customer === 'vip') chips.push(`${ic('star')}VIP: cost ×0.3, lateness penalty ×2`);
  if (c.time === 'rush_hour') chips.push(`${ic('clock')}rush hour: +10% on busy roads`);
  ctx.sc.routes.filter(r => r.underpass && ctx.sc.weather === 'rain').forEach(r => chips.push(`${ic('rain')}rain and underpass on ${r.name}: ×1.3`));
  c.alerts.forEach(a => chips.push(`${ic('alert')}${ALERT_LABEL[a[1]]} on ${a[0]}: +${FD.EXPECTED_ALERT_DELAY[a[1]]} min expected`));
  const chipHtml = `<div class="ctx">${chips.length ? chips.map(x => `<span class="pill">${x}</span>`).join('') : '<span class="pill">no special context: it decides like the utility agent</span>'}</div>`;
  const keys = [['time', 'Time', 'var(--f-time)'], ['distance', 'Distance', 'var(--f-dist)'], ['traffic', 'Traffic', 'var(--f-traffic)'], ['cost', 'Cost', 'var(--f-cost)']];
  const rowH = 22, x0 = 66, x1 = W - 104, max = 0.8, sx = v => x0 + v / max * (x1 - x0), H = keys.length * rowH + 4;
  let g = '';
  keys.forEach(([k, name, color], i) => {
    const y = 2 + i * rowH, w = t.weights[k], d = FD.DEFAULT_WEIGHTS[k];
    g += `<g data-tip="${esc(`${name} weight\nadapted ${f2(w)}, default ${f2(d)}`)}" tabindex="0">` + txt(0, y + 13, name) + `<rect x="${x0}" y="${y + 3}" width="${Math.max(1, sx(w) - x0)}" height="12" rx="3" style="fill:${color}"/>` +
         `<line x1="${sx(d)}" x2="${sx(d)}" y1="${y}" y2="${y + 18}" style="stroke:var(--ink)" stroke-width="2"/>` + txt(x1 + 10, y + 13, f2(w), 't-ink') + (Math.abs(w - d) > 1e-9 ? txt(x1 + 46, y + 13, `was ${f2(d)}`) : '') + '</g>';
  });
  const weights = `<div class="lab">Priorities (tick = default)</div>` + svgBox(W, H, 'Weights used: ' + keys.map(([k, n]) => `${n} ${f2(t.weights[k])}`).join(', '), g) +
    (t.latePenalty !== FD.LATE_PENALTY ? `<div class="legend"><span>Lateness penalty ×${t.latePenalty / FD.LATE_PENALTY} (VIP)</span></div>` : '');
  return chipHtml + weights + `<div class="lab">Estimated minutes</div>` + vizBelief(t, ctx, 'context');
}

/* ui_lab.js - the Scenario Lab: controls -> real agents -> live strip, hero, reality cards and one card per agent. */
'use strict';
const IDEA = [
  'IF-THEN rules on what it senses right now. No memory, no deadline, no cost.',
  'The same kind of rules, but reading an internal state, so a missing live reading is replaced by the last known one.',
  'Predicts each road’s time and takes the first road that meets the deadline. Cost is ignored.',
  'Scores every road on time, distance, traffic and cost, then takes the best score.',
  'Corrects the published travel times with factors learned from past deliveries.',
  'Splits the job into five subgoals; the road must fit the time left after the others, with a 10% safety margin.',
  'Lets hot food, VIP customers, rush hour, alerts and rain on an underpass change both its estimates and its priorities.',
];
const VIZ = [(t) => vizRules(t), (t) => vizState(t), vizGoal, vizUtility, vizLearning, vizHier, vizContext];

function compute() {
  const sc = S.sc, agents = FD.makeAgents(DATA.learn.snaps[S.exp]);
  const runs = agents.map(a => FD.runOne(a, sc)), truth = {};
  sc.routes.forEach(r => { truth[r.name] = FD.explain(sc, r.name); });
  return { sc, runs, truth, best: FD.minBy(sc.routes, r => truth[r.name].total).name };
}

// ---------------------------------------------------------------- controls
function buildControls() {
  const roads = S.sc.routes.map(r => `
    <div class="road"><div class="road-top"><span class="road-n">${chip(r.name)}<b>Road ${r.name}</b></span>${seg('traffic-' + r.name, `Traffic on road ${r.name}`, [['light', 'Light'], ['normal', 'Normal'], ['heavy', 'Heavy']])}</div>
      <div class="road-opts">
        <label class="alert-row"><span>Alert</span><select id="alert-${r.name}" aria-label="Alert on road ${r.name}"><option value="">None</option><option value="accident">Accident</option><option value="road_works">Road works</option><option value="procession">Procession</option></select></label>
        <label class="checkrow"><input type="checkbox" id="feed-${r.name}" aria-label="Live traffic feed down on road ${r.name}"><span>Feed down</span></label>

function setScenOpen(open) {
  S.scenOpen = open;
  $('#scen-body').classList.toggle('collapsed', !open);
  const b = $('#scen-toggle');
  b.setAttribute('aria-expanded', String(open));
  $('span', b).textContent = open ? 'Hide' : 'Edit';
}
function syncControls() {
  const s = S.sc;
  setSeg('weather', s.weather); setSeg('time', s.ctx.time); setSeg('customer', s.ctx.customer); setSeg('food', s.ctx.food);
  $('#deadline').value = s.deadline; $('#deadline-out').textContent = s.deadline + ' min'; $('#urgent').checked = s.urgent;
  s.routes.forEach(r => {
    setSeg('traffic-' + r.name, r.traffic); $('#feed-' + r.name).checked = s.feedDown.includes(r.name);
    const a = s.ctx.alerts.find(x => x[0] === r.name);
    $('#alert-' + r.name).value = a ? a[1] : '';
  });
  $$('#scen [data-preset]').forEach(b => { if (b.dataset.preset !== 'random') b.setAttribute('aria-pressed', String(sameSituation(s, TESTS[+b.dataset.preset].s))); });
}
function onScenClick(e) {
  if (e.target.closest('#scen-toggle')) return setScenOpen(!S.scenOpen);
  const p = e.target.closest('[data-preset]');
  if (p) {
    if (p.dataset.preset === 'random') { S.randomCount++; S.sc = FD.randomSituation(Math.random, S.randomCount); } else S.sc = clone(TESTS[+p.dataset.preset].s);
    return update();
  }
  const b = e.target.closest('.seg button');
  if (!b) return;
  const [k, road] = b.parentElement.id.split('-'), v = b.dataset.v, s = S.sc;
  if (k === 'weather') s.weather = v;
  else if (k === 'time') s.ctx.time = v;
  else if (k === 'customer') s.ctx.customer = v;
  else if (k === 'food') s.ctx.food = v;
  else if (k === 'traffic') s.routes.find(r => r.name === road).traffic = v;
  update();
}
function onScenInput(e) {
  if (e.target.id === 'deadline') { S.sc.deadline = +e.target.value; update(); }
}
function onScenChange(e) {
  const id = e.target.id || '';
  if (id === 'urgent') { S.sc.urgent = e.target.checked; update(); }
  else if (id.startsWith('feed-')) {
    const road = id.slice(5);
    S.sc.feedDown = e.target.checked ? [...new Set([...S.sc.feedDown, road])].sort() : S.sc.feedDown.filter(n => n !== road);
    update();
  } else if (id.startsWith('alert-')) {
    const road = id.slice(6);
    S.sc.ctx.alerts = S.sc.ctx.alerts.filter(a => a[0] !== road);
    if (e.target.value) S.sc.ctx.alerts.push([road, e.target.value]);
    S.sc.ctx.alerts.sort((a, b) => a[0] < b[0] ? -1 : 1);
    update();
  }
}

/* ui_score.js - the Scoreboard: 1,000 unseen deliveries (computed by the Python code), sliced by situation. */
'use strict';
const ROWS = [
  { key: '1. Simple Reflex', n: '1', name: 'Simple reflex' }, { key: '2. Model-Based Reflex', n: '2', name: 'Model-based reflex' },
  { key: '3. Goal-Based', n: '3', name: 'Goal-based' }, { key: '4. Utility-Based', n: '4', name: 'Utility-based' },
  { key: '5. Learning (untrained)', n: '5', name: 'Learning', sub: 'before training' }, { key: '5. Learning', n: '5', name: 'Learning', sub: 'after 600 deliveries' },
  { key: '6. Hierarchical', n: '6', name: 'Hierarchical' }, { key: '7. Contextual', n: '7', name: 'Contextual' },
  { key: 'Oracle (hindsight)', n: '', name: 'Hindsight best', sub: 'knows the real times', ref: true }];
const METRICS = { ot: { label: 'On time', dec: 1, unit: '%', high: true }, mins: { label: 'Average time', dec: 1, unit: ' min', high: false }, cost: { label: 'Average cost', dec: 0, unit: '', pre: 'Rs ', high: false } };
const fmtM = (m, v) => `${METRICS[m].pre || ''}${FD.pyfmt(v, METRICS[m].dec)}${METRICS[m].unit}`;
const rowName = r => (r.n ? r.n + ' ' : '') + r.name;

function buildScore() {
  const b = DATA.meta;
  $('#v-score').innerHTML = `
    <div class="sec-h"><h2>Scoreboard</h2><p>${b.benchN.toLocaleString('en-US')} random deliveries that no agent saw during training, ${b.benchUrgent} of them urgent. Every agent faces the same deliveries; the numbers come straight from the assignment’s Python code.</p></div>
    <div class="card">
      <div class="ctrl-row">
        <div class="fld" style="margin:0"><label>Measure</label>${seg('metric', 'Measure', [['ot', 'On time'], ['mins', 'Avg time'], ['cost', 'Avg cost']])}</div>
        <div class="fld" style="margin:0"><label>Kind of delivery</label><div class="chips" id="conds" role="radiogroup" aria-label="Kind of delivery">${DATA.conds.map(c => `<button type="button" class="chip" role="radio" aria-checked="false" data-cond="${c[0]}">${esc(c[1])}</button>`).join('')}</div></div>
      </div>
      <p class="take" id="take"></p>
      <div class="dots" id="dots"></div>
      <details class="nums"><summary>Show as table</summary><div class="scroll-x" id="sbtable"></div></details>
    </div>
    <div class="two" style="margin-top:16px">
      <div class="card"><h3 class="lab" style="margin-bottom:4px">Which roads each agent picks</h3><p class="note" id="mixnote" style="margin-bottom:12px"></p>
        <div class="legend" style="margin-bottom:10px">${RN.map(n => `<span>${chip(n)} road ${n}</span>`).join('')}</div><div class="mix" id="mix"></div></div>
      <div class="card"><h3 class="lab" style="margin-bottom:4px">The three required tests</h3><p class="note" style="margin-bottom:12px">Road chosen and whether the order arrived on time. Open a test in the Lab to see every agent’s working.</p><div class="scroll-x" id="tests"></div></div>
    </div>`;
  $('#v-score').addEventListener('click', e => {
    const c = e.target.closest('[data-cond]'), m = e.target.closest('#metric button'), t = e.target.closest('[data-open-test]');
    if (c) { S.cond = c.dataset.cond; renderScore(); } else if (m) { S.metric = m.dataset.v; renderScore(); } else if (t) { S.sc = clone(TESTS[+t.dataset.openTest].s); showTab('lab'); }
  });
}
function renderScore() {
  const cond = DATA.bench.cond[S.cond], m = S.metric, M = METRICS[m];
  setSeg('metric', m);
  $$('#conds .chip').forEach(c => c.setAttribute('aria-checked', String(c.dataset.cond === S.cond)));
  const val = r => cond.rows[r.key][m], vals = ROWS.map(val), agentRows = ROWS.filter(r => !r.ref && r.sub !== 'before training');
  const better = (a, b) => M.high ? a > b : a < b;
  let best = agentRows[0], worst = agentRows[0];
  agentRows.forEach(r => { if (better(val(r), val(best))) best = r; if (better(val(worst), val(r))) worst = r; });
  const ref = ROWS.find(r => r.ref);
  $('#take').innerHTML = `${M.high ? 'Best' : (m === 'cost' ? 'Cheapest' : 'Fastest')}: <b>${esc(rowName(best))}</b> (${fmtM(m, val(best))}). ${M.high ? 'Lowest' : (m === 'cost' ? 'Most expensive' : 'Slowest')}: <b>${esc(rowName(worst))}</b> (${fmtM(m, val(worst))}). ${m === 'ot' ? `Hindsight ceiling: ${fmtM(m, val(ref))}.` : ''} <span style="color:var(--ink2)">${S.cond === 'all' ? `Across all ${cond.n} deliveries.` : `${esc(cond.label)}: ${cond.n} deliveries.`}</span>`;
  // axis chosen from the data (a dot plot needs no zero baseline; the axis range is printed)
  const lo = Math.min(...vals), hi = Math.max(...vals), span = Math.max(hi - lo, M.high ? 2 : 1), step = niceStep(span * 1.6, 4);
  let a0 = Math.floor((lo - span * 0.2) / step) * step, a1 = Math.ceil((hi + span * 0.2) / step) * step;
  if (M.high) a1 = Math.min(a1, 100);
  if (!M.high) a0 = Math.max(0, a0);
  const N = Math.max(2, Math.round((a1 - a0) / step)), pos = v => clamp((v - a0) / (a1 - a0) * 100, 0, 100);
  let h = `<div></div><div class="axis">${Array.from({ length: N + 1 }, (_, i) => `<span style="left:${i / N * 100}%">${FD.pyfmt(a0 + i * (a1 - a0) / N, step < 1 ? 1 : 0)}</span>`).join('')}</div><div></div>`;
  ROWS.forEach(r => {
    const v = val(r), isBest = !r.ref && r === best, o = cond.rows[r.key];
    const tipText = `${rowName(r)}${r.sub ? ' (' + r.sub + ')' : ''}\n${FD.pyfmt(o.ot, 1)}% on time · ${FD.pyfmt(o.mins, 1)} min · Rs ${FD.pyfmt(o.cost, 0)}\n${cond.n} deliveries`;
    if (r.ref) h += '<div class="sep"></div>';
    h += `<div class="lab2${isBest ? ' best' : ''}">${esc(rowName(r))}${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</div>` +
         `<div class="track" style="--n:${N}" data-tip="${esc(tipText)}" tabindex="0"><span class="dot${isBest ? ' best' : ''}${r.ref ? ' ref' : ''}" style="left:${pos(v)}%"></span></div><div class="val">${fmtM(m, v).replace(/^Rs /, '')}</div>`;
  });
  $('#dots').innerHTML = h + `<div></div><div class="note" style="grid-column:2 / -1;margin-top:6px">Axis runs from ${FD.pyfmt(a0, step < 1 ? 1 : 0)} to ${FD.pyfmt(a1, step < 1 ? 1 : 0)}${M.unit.trim() ? ' ' + M.unit.trim() : ''}${m === 'cost' ? ' (Rs)' : ''}, not from zero.</div>`;
  $('#sbtable').innerHTML = `<table class="tbl"><thead><tr><th>Agent</th><th>On time</th><th>Avg time</th><th>Avg cost</th></tr></thead><tbody>` + ROWS.map(r => { const o = cond.rows[r.key];
    return `<tr><td>${esc(rowName(r))}${r.sub ? ` <span class="pill">${esc(r.sub)}</span>` : ''}</td><td class="num">${FD.pyfmt(o.ot, 1)}%</td><td class="num">${FD.pyfmt(o.mins, 1)} min</td><td class="num">Rs ${FD.pyfmt(o.cost, 0)}</td></tr>`; }).join('') + '</tbody></table>';
  // route mix for the same slice
  $('#mixnote').textContent = `${cond.label}: share of the ${cond.n} deliveries sent down each road.`;
  $('#mix').innerHTML = ROWS.filter(r => r.sub !== 'before training').map(r => {
    const mix = cond.rows[r.key].mix, total = mix.reduce((x, y) => x + y, 0);
    return `<div class="lab2">${esc(rowName(r))}</div><div class="mixbar" role="img" aria-label="${esc(rowName(r))}: ${RN.map((n, i) => `road ${n} ${Math.round(mix[i] / total * 100)}%`).join(', ')}">` +
      mix.map((c, i) => c ? `<span style="flex:${c} 1 0;background:${RV(RN[i])}" data-tip="${esc(`${rowName(r)}\nRoad ${RN[i]}: ${c} of ${total} (${FD.pyfmt(c / total * 100, 0)}%)`)}" tabindex="0">${c / total >= 0.16 ? Math.round(c / total * 100) + '%' : ''}</span>` : '').join('') + '</div>';
  }).join('');
  const names = DATA.agentNames;
  $('#tests').innerHTML = `<table class="tbl"><thead><tr><th>Agent</th>${TESTS.map((t, i) => `<th><button type="button" class="link" data-open-test="${i}">Test ${i + 1}</button></th>`).join('')}<th>On time</th></tr></thead><tbody>` +
    NAMES.map((n, j) => { const res = TESTS.map(t => t.agents[j]);
      return `<tr><td>${j + 1} ${n}</td>${res.map((x, i) => `<td><span class="cell" data-tip="${esc(`Test ${i + 1}: ${NAMES[j]}\nRoad ${x.route}, ${f1(x.minutes)} min, ${x.onTime ? 'on time' : 'late'}`)}" tabindex="0">${chip(x.route)}${ic(x.onTime ? 'check' : 'cross', x.onTime ? 'ok' : 'late')}</span></td>`).join('')}<td class="num">${res.filter(x => x.onTime).length}/3</td></tr>`; }).join('') + '</tbody></table>';
}

      <p class="note" id="curve-note" style="margin-top:8px">On-time rate on the ${DATA.meta.benchN.toLocaleString('en-US')} unseen deliveries of the Scoreboard, measured after every ${DATA.meta.step} training deliveries. With no experience the agent decides exactly like the utility-based agent. Click or drag the chart to jump.</p>
    </div>
    <div class="two" style="margin-top:16px">
      <div class="card"><h3 class="lab" style="margin-bottom:4px">What it has learned</h3><p class="note" style="margin-bottom:10px">A factor multiplies the published travel time. Stronger colour means the published time was too optimistic. Look at road B in rain (the underpass floods) and road A in heavy traffic (market spill-over): effects the live feed never reports.</p><div class="scroll-x" id="ftbl"></div></div>
      <div class="card"><h3 class="lab" style="margin-bottom:4px">Its latest lessons</h3><p class="note" style="margin-bottom:10px">The critic compares the actual ride time with the published one; the learning element moves that situation’s factor one step (1 / (samples + 3)) toward the ratio. While training, one delivery in four tries a random road to gain new experience.</p><div class="scroll-x" id="llog"></div></div>
    </div>`;
  $('#exp2').addEventListener('input', e => { S.exp = +e.target.value; renderLearn(); });
  const curve = $('#curve'), steps = L.steps;
  const idxOf = e => {
    const svg = $('svg', curve), g = S.geom;
    if (!svg || !g) return 0;
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) * (g.W / r.width);
    return clamp(Math.round((x - g.x0) / (g.x1 - g.x0) * (g.n - 1)), 0, g.n - 1);
  };
  const setIdx = i => { if (i !== S.exp) { S.exp = i; renderLearn(); } };
  curve.addEventListener('pointerdown', e => { try { curve.setPointerCapture(e.pointerId); } catch (_) {} setIdx(idxOf(e)); });
  curve.addEventListener('pointermove', e => {
    const i = idxOf(e);
    if (e.buttons) return setIdx(i);
    const c = L.curve[i];
    showTip(`${steps[i]} past deliveries\nUrgent ${FD.pyfmt(c.urg, 1)}% \u00b7 all ${FD.pyfmt(c.all, 1)}%\nAverage ${FD.pyfmt(c.mins, 1)} min`, e.clientX, e.clientY);
  });
  curve.addEventListener('pointerleave', hideTip);
}
function renderLearn() {
  const L = DATA.learn, k = S.exp, ep = L.steps[k], cur = L.curve[k], base = L.curve[0];
  $('#exp2-out').textContent = ep;
  if ($('#exp2').value !== String(k)) $('#exp2').value = k;
  const d = (a, b, dec = 1) => { const x = a - b; return `${x >= 0 ? '+' : '−'}${FD.pyfmt(Math.abs(x), dec)}`; };
  $('#ltiles').innerHTML = [['urg', 'On time, urgent', '%', 1], ['all', 'On time, all deliveries', '%', 1], ['mins', 'Average time', ' min', 1]].map(([m, label, unit, dec]) =>
    `<div class="tile2"><span>${label}</span><b class="num">${FD.pyfmt(cur[m], dec)}${unit}</b><em class="num">${ep === 0 ? 'starting point' : `${d(cur[m], base[m], dec)} vs. no experience`}</em></div>`).join('');
  renderCurve();
  // knowledge table
  const snap = L.snaps[k];
  const cell = (road, tr, w) => { const e = snap[`${road}|${tr}|${w}`]; if (!e) return `<td title="not seen yet">–<small>0 samples</small></td>`;
    const kk = clamp((e[0] - 1) / 0.45 * 55, 0, 55); return `<td class="${rcls(road)}-t" style="--k:${kk.toFixed(0)}" data-tip="${esc(`Road ${road}, ${tr} traffic, ${w}\nPublished time × ${f2(e[0])}\n${e[1]} past deliveries`)}" tabindex="0">×${f2(e[0])}<small>${e[1]} samples</small></td>`; };
  $('#ftbl').innerHTML = `<table class="ftbl"><thead><tr><th></th><th>Dry</th><th>Rain</th></tr></thead><tbody>` + RN.flatMap(r => LEVELS.map(tr =>
    `<tr><th class="rowh">${chip(r)}${tr}</th>${cell(r, tr, 'clear')}${cell(r, tr, 'rain')}</tr>`)).join('') + '</tbody></table>';
  // critic log: the last six lessons up to this point
  const ev = L.events.filter(e => e[0] <= ep).slice(-6).reverse();
  $('#llog').innerHTML = ep === 0 ? '<p class="note">No deliveries yet. Move the slider to replay training.</p>' :
    `<table class="log"><thead><tr><th>#</th><th>Road</th><th>Situation</th><th>Expected</th><th>Actual</th><th>Factor</th></tr></thead><tbody>` + ev.map(e =>
      `<tr><td class="num">${e[0]}</td><td>${chip(e[1])}${e[4] ? ' <span class="pill">tried at random</span>' : ''}</td><td>${e[2]}, ${e[3] === 'rain' ? 'rain' : 'dry'}</td><td class="num">${f1(e[5])} min</td><td class="num">${f1(e[6])} min</td><td class="num">${f2(e[7])} → <b>${f2(e[8])}</b></td></tr>`).join('') + '</tbody></table>';
}
function renderCurve() {
  const L = DATA.learn, el = $('#curve'), W = Math.max(260, Math.floor(el.clientWidth || 320)), H = 240, m = { l: 36, r: 10, t: 12, b: 28 };
  const orc = DATA.bench.cond.all.rows['Oracle (hindsight)'].ot, orcU = DATA.bench.cond.urgent.rows['Oracle (hindsight)'].ot;
  const all = L.curve.map(c => c.all), urg = L.curve.map(c => c.urg);
  const lo = Math.floor((Math.min(...urg) - 1) / 5) * 5, hi = Math.min(100, Math.ceil((Math.max(...all, orc) + 0.5) / 5) * 5);
  const x0 = m.l, x1 = W - m.r, y0 = H - m.b, y1 = m.t, steps = L.steps, last = steps[steps.length - 1];
  const sx = v => x0 + v / last * (x1 - x0), sy = v => y0 - (v - lo) / (hi - lo) * (y0 - y1);
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += 5) g += `<line class="grid" x1="${x0}" x2="${x1}" y1="${sy(v)}" y2="${sy(v)}"/>` + txt(x0 - 6, sy(v) + 4, `${v}%`, '', 'end');
  for (let v = 0; v <= last; v += 100) g += txt(sx(v), H - 8, String(v), '', v === 0 ? 'start' : v === last ? 'end' : 'middle');
  g += `<line class="axis" x1="${x0}" x2="${x1}" y1="${y0}" y2="${y0}"/>`;
  [[orc, 'hindsight best (all)'], [orcU, 'hindsight best (urgent)']].forEach(([v, t]) => { g += `<line class="dl" x1="${x0}" x2="${x1}" y1="${sy(v)}" y2="${sy(v)}"/>` + txt(x1, sy(v) - 5, `${t} ${FD.pyfmt(v, 1)}%`, '', 'end'); });
  const line = (arr, style, w) => `<polyline fill="none" style="${style}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" points="${arr.map((v, i) => `${sx(steps[i]).toFixed(1)},${sy(v).toFixed(1)}`).join(' ')}"/>`;
  g += line(all, 'stroke:var(--bar)', 2) + line(urg, 'stroke:var(--ink)', 2);
  const cx = sx(steps[S.exp]);
  g += `<line x1="${cx}" x2="${cx}" y1="${y1}" y2="${y0}" style="stroke:var(--ink)" stroke-width="1"/>` +
       `<circle cx="${cx}" cy="${sy(all[S.exp])}" r="5" style="fill:var(--bar);stroke:var(--surface)" stroke-width="2"/><circle cx="${cx}" cy="${sy(urg[S.exp])}" r="5.5" style="fill:var(--ink);stroke:var(--surface)" stroke-width="2"/>`;
  el.innerHTML = svgBox(W, H, `Learning curve: on-time rate for urgent deliveries rises from ${FD.pyfmt(urg[0], 1)}% with no experience to ${FD.pyfmt(urg[urg.length - 1], 1)}% after ${last} past deliveries; all deliveries from ${FD.pyfmt(all[0], 1)}% to ${FD.pyfmt(all[all.length - 1], 1)}%`, g);
  S.geom = { W, x0, x1, n: steps.length };
}

/* ui_main.js - tabs, resize handling and start-up. */
'use strict';
const TABS = ['lab', 'score', 'learn'];
function refresh() {
  if (S.tab === 'lab') update(); else if (S.tab === 'score') renderScore(); else renderLearn();
}
function showTab(tab) {
  S.tab = tab;
  TABS.forEach(t => {
    $('#v-' + t).hidden = t !== tab;
    const b = $('#tab-' + t);
    b.setAttribute('aria-selected', String(t === tab));
    b.tabIndex = t === tab ? 0 : -1;
  });
  hideTip();
  refresh();
  window.scrollTo(0, 0);
}
function initMain() {
  $('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });
  $('.tabs').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const j = (TABS.indexOf(S.tab) + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
    showTab(TABS[j]); $('#tab-' + TABS[j]).focus(); e.preventDefault();
  });
  $('#foot').innerHTML = `<p>Every decision on this page comes from a JavaScript copy of the assignment’s Python agents. It was compared with the Python output on ${EQUIV.situations.toLocaleString('en-US')} situations (${EQUIV.checks.toLocaleString('en-US')} checks) and matched every road, explanation, plan and delivery time.</p>` +
    `<p>The Scoreboard and Learning figures were computed by the Python code: ${DATA.meta.benchN.toLocaleString('en-US')} unseen deliveries (seed ${DATA.meta.benchSeed}); the learning agent trained on ${DATA.meta.episodes} past deliveries (seed ${DATA.meta.trainSeed}).</p>`;
  buildScore(); buildLearn(); initLab();
  const h = (window.location.hash || '').slice(1);
  showTab(TABS.includes(h) ? h : 'lab');
  let lastW = $('#app').clientWidth, raf = 0;
  if (window.ResizeObserver) new ResizeObserver(entries => {
    const w = Math.round(entries[0].contentRect.width);
    if (w === lastW) return;
    lastW = w; cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => { if (S.tab !== 'score') refresh(); });
  }).observe($('#app'));
}
initMain();

</script>
